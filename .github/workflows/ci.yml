name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.95 minimum version
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Verify the declared minimum Rust version
        run: cargo check --all-features --locked

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check repository formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Build deterministic RPA fixtures
        shell: bash
        run: |
          python tests/build_fixtures.py
          git diff --exit-code -- tests/fixtures/sample.rpa

      - name: Run all tests
        run: cargo test --all-targets --all-features --locked

      - name: Run clippy with warnings denied
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release binaries
        run: cargo build --release --all-features --locked --bins

      - name: Smoke-test release binaries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./target/release/renpyex.exe --version
            ./target/release/renpyex-gui.exe --probe
          else
            ./target/release/renpyex --version
            ./target/release/renpyex-gui --probe
          fi
