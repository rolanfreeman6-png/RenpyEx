name: Release Windows binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate tag and package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH, got '$env:RELEASE_TAG'"
          }

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object { $_.name -eq 'renpyex' })
          if ($package.Count -ne 1) {
            throw "Expected exactly one renpyex package, found $($package.Count)"
          }

          $expectedVersion = $env:RELEASE_TAG.Substring(1)
          if ($package[0].version -ne $expectedVersion) {
            throw "Tag $env:RELEASE_TAG does not match Cargo version $($package[0].version)"
          }

          "RELEASE_TAG=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$expectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check repository formatting
        run: cargo fmt --all -- --check

      - name: Build deterministic RPA fixtures
        shell: pwsh
        run: |
          python tests/build_fixtures.py
          if ($LASTEXITCODE -ne 0) {
            throw "Fixture generator failed with exit code $LASTEXITCODE"
          }
          git diff --exit-code -- tests/fixtures/sample.rpa
          if ($LASTEXITCODE -ne 0) {
            throw "tests/fixtures/sample.rpa is not reproducible"
          }

      - name: Run tests with GUI feature
        run: cargo test --all-targets --all-features --locked

      - name: Run clippy with warnings denied
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release binaries
        run: cargo build --release --all-features --locked --bin renpyex --bin renpyex-gui

      - name: Smoke-test release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cliVersion = (& .\target\release\renpyex.exe --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "CLI version probe failed with exit code $LASTEXITCODE"
          }
          if ($cliVersion -ne "renpyex $env:RELEASE_VERSION") {
            throw "Unexpected CLI version output: '$cliVersion'"
          }

          & .\target\release\renpyex-gui.exe --probe
          if ($LASTEXITCODE -ne 0) {
            throw "GUI probe failed with exit code $LASTEXITCODE"
          }

      - name: Package binaries and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item .\target\release\renpyex.exe $dist
          Copy-Item .\target\release\renpyex-gui.exe $dist

          $lines = foreach ($name in @('renpyex.exe', 'renpyex-gui.exe')) {
            $hash = (Get-FileHash (Join-Path $dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$name"
          }
          [IO.File]::WriteAllText(
            (Join-Path $dist 'SHA256SUMS.txt'),
            (($lines -join [Environment]::NewLine) + [Environment]::NewLine),
            (New-Object Text.UTF8Encoding($false))
          )

          Get-ChildItem $dist | Format-Table Name,Length
          Get-Content (Join-Path $dist 'SHA256SUMS.txt')

      - name: Create GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --title "RenpyEx $env:RELEASE_TAG" `
            --generate-notes `
            .\dist\renpyex.exe `
            .\dist\renpyex-gui.exe `
            .\dist\SHA256SUMS.txt
